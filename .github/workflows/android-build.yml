name: WAS Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Copy latest WAS web app
        run: cp index.html www/index.html
      - name: Generate Android project
        run: npx cap add android
      - name: Add native Android print bridge
        run: |
          mkdir -p android/app/src/main/java/com/was/agri
          cat > android/app/src/main/java/com/was/agri/MainActivity.java <<'EOF'
          package com.was.agri;
          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(WASPrintPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > android/app/src/main/java/com/was/agri/WASPrintPlugin.java <<'EOF'
          package com.was.agri;
          import android.content.Context;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "WASPrint")
          public class WASPrintPlugin extends Plugin {
            @PluginMethod
            public void print(PluginCall call) {
              String html = call.getString("html");
              String title = call.getString("title", "WAS Report");
              if (html == null || html.isEmpty()) {
                call.reject("Report content is empty");
                return;
              }
              getActivity().runOnUiThread(() -> {
                WebView printView = new WebView(getContext());
                printView.getSettings().setJavaScriptEnabled(false);
                printView.setWebViewClient(new WebViewClient() {
                  @Override
                  public void onPageFinished(WebView view, String url) {
                    PrintManager manager = (PrintManager) getContext().getSystemService(Context.PRINT_SERVICE);
                    if (manager == null) {
                      call.reject("Android print service is unavailable");
                      return;
                    }
                    manager.print(title, view.createPrintDocumentAdapter(title), null);
                    call.resolve();
                  }
                });
                printView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
              });
            }
          }
          EOF
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WAS-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build Play Store bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/was-upload-key.jks
          cat > android/keystore.properties <<EOF
          storeFile=../was-upload-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          cd android
          ./gradlew bundleRelease
      - name: Upload Play Store AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WAS-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
