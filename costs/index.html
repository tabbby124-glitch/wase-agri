<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234b35"><link rel="manifest" href="./manifest.webmanifest"><title>WAS – إدارة تكاليف التقاوي</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#17251c;--muted:#66756b;--green:#24583b;--line:#dce5dc;--red:#a83232;--gold:#a87520}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Arabic",Tahoma,sans-serif;padding-bottom:82px}header{background:var(--green);color:#fff;padding:16px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:3}header h1{font-size:19px;margin:0}header p{font-size:12px;margin:4px 0 0;opacity:.85}main{max-width:850px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:5px}.search{display:flex;gap:8px}.search input{flex:1}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#17251c;margin:5px 0 10px}label{font-size:13px;font-weight:650}button{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font:inherit;font-weight:650;cursor:pointer}button.secondary{background:#e8eee8;color:var(--green)}button.danger{background:#fae9e9;color:var(--red)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#183c29}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.muted{color:var(--muted);font-size:12px}.amount{font-weight:800;color:var(--green)}.pill{display:inline-block;background:#eaf1e9;color:var(--green);padding:3px 8px;border-radius:20px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:22px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;z-index:8;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px;font-size:18px}.bottom{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:transparent;color:var(--muted);padding:7px 5px;font-size:12px}.bottom button.active{color:var(--green);background:#edf3ed}.fieldrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.fieldrow b{font-size:14px}.check{display:flex;align-items:center;gap:8px;font-weight:500}.check input{width:auto;margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{font-size:12px}.warning{background:#fff3dc;border:1px solid #f0d8a5;color:#684b12;border-radius:10px;padding:10px;font-size:12px}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:16px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script></head><body>
<header><h1>🌱 WAS – إدارة تكاليف التقاوي</h1><p>إدارة الحواشات والمصروفات التعاقدية لجميع المحاصيل</p></header>
<main id="app"></main>
<nav class="bottom" id="nav"><button data-tab="home" class="active">🏠<br>الرئيسية</button><button data-tab="fields">🌾<br>الحواشات</button><button data-tab="costs">💳<br>المصروفات</button><button data-tab="reports">📊<br>التقارير</button><button data-tab="settings">⚙️<br>الإعدادات</button></nav>
<div id="modal" class="hidden"></div>
<script>
const KEY='was_seed_costs_v1';const $=s=>document.querySelector(s);const money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2});const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const defaults={seasons:[{id:'season-2026',name:'موسم 2026/2027',active:true}],fields:[],expenses:[],currency:'جنيه',company:'WAS'};
let data=load();let tab='home';let selectedField=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}
function save(){data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));render()}
function activeSeason(){return data.seasons.find(s=>s.active)||data.seasons[0]}
function seasonFields(){return data.fields.filter(f=>f.seasonId===activeSeason()?.id)}
function expenseTotal(){return data.expenses.reduce((s,e)=>s+Number(e.amount||0),0)}
function fieldTotal(fid){return data.expenses.reduce((s,e)=>s+(e.allocations||[]).filter(a=>a.fieldId===fid).reduce((x,a)=>x+Number(a.amount||0),0),0)}
function categoryName(c){return c||'غير مصنف'}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const app=$('#app');if(tab==='home')app.innerHTML=home();if(tab==='fields')app.innerHTML=fieldsPage();if(tab==='costs')app.innerHTML=costsPage();if(tab==='reports')app.innerHTML=reportsPage();if(tab==='settings')app.innerHTML=settingsPage();$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function home(){const fs=seasonFields();return `<div class="card"><div class="fieldrow"><div><b>الموسم الحالي</b><div class="muted">${escapeHtml(activeSeason()?.name||'لا يوجد موسم')}</div></div><span class="pill">نشط</span></div></div><div class="stats"><div class="stat"><small>عدد الحواشات</small><strong>${fs.length}</strong></div><div class="stat"><small>إجمالي المساحات (فدان)</small><strong>${money(fs.reduce((s,f)=>s+Number(f.area||0),0))}</strong></div><div class="stat"><small>إجمالي المصروفات</small><strong>${money(expenseTotal())} ${escapeHtml(data.currency)}</strong></div><div class="stat"><small>متوسط تكلفة الفدان</small><strong>${money(fs.reduce((s,f)=>s+Number(f.area||0),0)?expenseTotal()/fs.reduce((s,f)=>s+Number(f.area||0),0):0)}</strong></div></div><div class="card"><h3>بحث سريع عن حواشة</h3><div class="search"><input id="quickSearch" placeholder="اسم المزارع أو رقم الحواشة"><button onclick="searchField()">بحث</button></div><div id="quickResults"></div></div><div class="card"><div class="fieldrow"><h3>آخر المصروفات</h3><button class="secondary" onclick="tab='costs';render()">عرض الكل</button></div>${data.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(expenseRow).join('')||'<div class="empty">لم تُسجل مصروفات بعد</div>'}</div><div class="toolbar"><button onclick="openFieldForm()">＋ إضافة حواشة</button><button onclick="openExpenseForm()">＋ تسجيل مصروف</button></div>`}
function fieldsPage(){return `<div class="fieldrow"><h2>الحواشات</h2><button onclick="openFieldForm()">＋ حواشة جديدة</button></div><input id="fieldSearch" placeholder="ابحث برقم الحواشة أو اسم المزارع أو المحصول" oninput="filterFields()"><div id="fieldList">${fieldCards(seasonFields())}</div>`}
function fieldCards(fs){return fs.map(f=>`<div class="card"><div class="fieldrow"><div><b>${escapeHtml(f.code)} — ${escapeHtml(f.farmer)}</b><div class="muted">${escapeHtml(f.crop)} · ${money(f.area)} فدان · ${escapeHtml(f.village||'')}</div></div><div class="amount">${money(fieldTotal(f.id))} ${escapeHtml(data.currency)}</div></div><div class="toolbar"><button onclick="openField(${JSON.stringify(f.id)})">فتح ملف الحواشة</button><button class="secondary" onclick="openExpenseForm(${JSON.stringify(f.id)})">إضافة تكلفة</button></div></div>`).join('')||'<div class="empty">لا توجد حواشات في الموسم الحالي. أضف أول حواشة.</div>'}
function filterFields(){const q=$('#fieldSearch').value.toLowerCase();$('#fieldList').innerHTML=fieldCards(seasonFields().filter(f=>[f.code,f.farmer,f.crop,f.village].join(' ').toLowerCase().includes(q)))}
function searchField(){const q=$('#quickSearch').value.toLowerCase();const r=seasonFields().filter(f=>[f.code,f.farmer,f.crop].join(' ').toLowerCase().includes(q));$('#quickResults').innerHTML=fieldCards(r)}
function openField(fid){const f=data.fields.find(x=>x.id===fid);if(!f)return;selectedField=fid;const ex=data.expenses.filter(e=>(e.allocations||[]).some(a=>a.fieldId===fid)).sort((a,b)=>b.date.localeCompare(a.date));showModal(`<h2>ملف الحواشة ${escapeHtml(f.code)}</h2><div class="card"><b>صاحب الحواشة: ${escapeHtml(f.farmer)}</b><p class="muted">${escapeHtml(f.crop)} · ${money(f.area)} فدان · ${escapeHtml(f.seasonName||'')}</p><p>رقم العقد: ${escapeHtml(f.contractNo||'—')}</p><h2 class="amount">إجمالي التكلفة: ${money(fieldTotal(fid))} ${escapeHtml(data.currency)}</h2><p>تكلفة الفدان: ${money(f.area?fieldTotal(fid)/f.area:0)} ${escapeHtml(data.currency)}</p></div><div class="toolbar"><button onclick="closeModal();openExpenseForm(${JSON.stringify(fid)})">＋ إضافة مصروف للحواشة</button><button class="secondary" onclick="fieldReport(${JSON.stringify(fid)})">تقرير الحواشة</button></div><h3>تفاصيل المصروفات</h3>${ex.map(expenseRow).join('')||'<div class="empty">لا توجد مصروفات لهذه الحواشة</div>'}<div class="toolbar"><button class="secondary" onclick="closeModal();openFieldForm(${JSON.stringify(fid)})">تعديل بيانات الحواشة</button></div>`)}
function costsPage(){return `<div class="fieldrow"><h2>سجل المصروفات</h2><button onclick="openExpenseForm()">＋ مصروف جديد</button></div><div class="stats"><div class="stat"><small>عدد القيود</small><strong>${data.expenses.length}</strong></div><div class="stat"><small>الإجمالي</small><strong>${money(expenseTotal())}</strong></div></div><input id="costSearch" placeholder="ابحث في البيان أو التصنيف أو المورد" oninput="filterCosts()"><div id="costList">${costRows(data.expenses)}</div>`}
function costRows(xs){return xs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(expenseRow).join('')||'<div class="empty">لا توجد مصروفات مسجلة</div>'}
function expenseRow(e){const fields=(e.allocations||[]).map(a=>data.fields.find(f=>f.id===a.fieldId)?.code||'').filter(Boolean).join('، ');return `<div class="item"><div class="fieldrow"><div><b>${escapeHtml(e.category)}</b><div class="muted">${escapeHtml(e.description)} · ${escapeHtml(e.date)} · ${e.mode==='shared'?'مصروف مشترك':'مصروف فردي'}</div><div class="muted">الحواشات: ${escapeHtml(fields||'غير محدد')} · ${escapeHtml(e.vendor||'')}</div></div><div class="amount">${money(e.amount)} ${escapeHtml(data.currency)}</div></div></div>`}
function filterCosts(){const q=$('#costSearch').value.toLowerCase();$('#costList').innerHTML=costRows(data.expenses.filter(e=>[e.category,e.description,e.vendor].join(' ').toLowerCase().includes(q)))}
function reportsPage(){const fs=seasonFields();return `<h2>التقارير</h2><div class="card"><h3>ملخص الموسم</h3><p>عدد الحواشات: <b>${fs.length}</b></p><p>المساحة: <b>${money(fs.reduce((s,f)=>s+Number(f.area||0),0))} فدان</b></p><p>إجمالي المصروفات الموزعة: <b>${money(fs.reduce((s,f)=>s+fieldTotal(f.id),0))} ${escapeHtml(data.currency)}</b></p><div class="toolbar"><button onclick="exportCSV()">تصدير Excel/CSV</button><button class="secondary" onclick="backup()">نسخة احتياطية</button></div></div><div class="card"><h3>تكلفة كل حواشة</h3>${fs.map(f=>`<div class="item fieldrow"><div><b>${escapeHtml(f.code)} — ${escapeHtml(f.farmer)}</b><div class="muted">${money(f.area)} فدان · ${escapeHtml(f.crop)}</div></div><div class="amount">${money(fieldTotal(f.id))}</div></div>`).join('')||'<div class="empty">لا توجد بيانات</div>'}</div>`}
function settingsPage(){return `<h2>الإعدادات</h2><div class="card"><h3>المزامنة السحابية</h3><p class="muted">تحتاج إلى تسجيل الدخول أولاً من تطبيق WAS الرئيسي بنفس الحساب. تُحفظ البيانات محلياً وتُرفع للسحابة عند طلبك.</p><div class="toolbar"><button onclick="cloudPush()">رفع البيانات للسحابة</button><button class="secondary" onclick="cloudPull()">استعادة من السحابة</button></div><p id="cloudStatus" class="muted">حالة الاتصال: لم يتم الفحص</p></div><div class="card"><label>اسم الشركة<input id="company" value="${escapeHtml(data.company)}"></label><label>اسم العملة<input id="currency" value="${escapeHtml(data.currency)}"></label><button onclick="data.company=$('#company').value;data.currency=$('#currency').value;save()">حفظ الإعدادات</button></div><div class="card"><h3>المواسم</h3>${data.seasons.map(s=>`<div class="item fieldrow"><span>${escapeHtml(s.name)} ${s.active?'<span class="pill">نشط</span>':''}</span><button class="secondary" onclick="activateSeason(${JSON.stringify(s.id)})">تفعيل</button></div>`).join('')}<button onclick="newSeason()">＋ موسم جديد</button></div><div class="card"><h3>البيانات</h3><div class="toolbar"><button class="secondary" onclick="backup()">تصدير نسخة احتياطية</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(this.files[0])"></div><p class="warning">النسخة الحالية تحفظ البيانات على هذا الجهاز فقط. ربط قاعدة البيانات السحابية والمزامنة بين الأجهزة مرحلة تالية بعد تهيئة قاعدة البيانات.</p></div>`}
function showModal(html){$('#modal').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">'+html+'<div style="margin-top:15px"><button class="secondary" style="width:100%" onclick="closeModal()">إغلاق</button></div></div></div>';$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
function openFieldForm(fid){const old=data.fields.find(f=>f.id===fid)||{};showModal(`<h2>${fid?'تعديل الحواشة':'إضافة حواشة جديدة'}</h2><label>رقم الحواشة / الكود<input id="fcode" value="${escapeHtml(old.code||'')}"></label><label>اسم صاحب الحواشة<input id="farmer" value="${escapeHtml(old.farmer||'')}"></label><div class="grid2"><div><label>المحصول<input id="crop" placeholder="ذرة، قمح، بطاطس..." value="${escapeHtml(old.crop||'')}"></label></div><div><label>المساحة بالفدان<input id="area" type="number" min="0.01" step="0.01" value="${old.area||''}"></label></div></div><div class="grid2"><div><label>القرية / القطاع<input id="village" value="${escapeHtml(old.village||'')}"></label></div><div><label>رقم العقد<input id="contract" value="${escapeHtml(old.contractNo||'')}"></label></div></div><label>ملاحظات<textarea id="fnotes">${escapeHtml(old.notes||'')}</textarea></label><button style="width:100%" onclick="saveField(${JSON.stringify(fid||'')})">حفظ الحواشة</button>`)}
function saveField(fid){const code=$('#fcode').value.trim(),farmer=$('#farmer').value.trim(),crop=$('#crop').value.trim(),area=Number($('#area').value);if(!code||!farmer||!crop||!(area>0))return alert('أكمل رقم الحواشة واسم المزارع والمحصول والمساحة بشكل صحيح.');if(data.fields.some(f=>f.code===code&&f.seasonId===activeSeason().id&&f.id!==fid))return alert('رقم الحواشة مسجل مسبقاً في هذا الموسم.');const old=data.fields.find(f=>f.id===fid);const rec={...(old||{}),id:old?.id||id(),seasonId:activeSeason().id,seasonName:activeSeason().name,code,farmer,crop,area,village:$('#village').value,contractNo:$('#contract').value,notes:$('#fnotes').value};if(old)Object.assign(old,rec);else data.fields.push(rec);closeModal();save()}
const cats=['التقاوي','تحضير الأرض','الزراعة','الأسمدة','المبيدات','الري والطاقة','العمالة','العمليات الزراعية','الحصاد','النقل والترحيل','الإشراف والإدارة','أخرى'];
function openExpenseForm(prefill){const targets=seasonFields();if(!targets.length)return alert('أضف حواشة واحدة على الأقل قبل تسجيل المصروف.');showModal(`<h2>تسجيل مصروف</h2><label>نوع المصروف<input id="ecat" list="cats" placeholder="اختر أو اكتب التصنيف"><datalist id="cats">${cats.map(c=>'<option>'+c+'</option>').join('')}</datalist></label><label>البيان / وصف المصروف<input id="edesc" placeholder="مثال: شراء سماد يوريا"></label><div class="grid2"><div><label>التاريخ<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><div><label>المبلغ الإجمالي<input id="eamount" type="number" min="0.01" step="0.01"></label></div></div><div class="grid2"><div><label>الكمية<input id="eqty" type="number" step="0.01"></label></div><div><label>سعر الوحدة<input id="eprice" type="number" step="0.01"></label></div></div><label>المورد / المستفيد<input id="evendor"></label><label>طريقة القيد</label><div class="row"><label class="check"><input type="radio" name="emode" value="individual" checked onchange="toggleAlloc()"> حواشة واحدة</label><label class="check"><input type="radio" name="emode" value="shared" onchange="toggleAlloc()"> مشترك</label></div><div id="individualBox"><label>الحواشة<select id="efield">${targets.map(f=>'<option value="'+f.id+'" '+(f.id===prefill?'selected':'')+'>'+escapeHtml(f.code+' — '+f.farmer)+'</option>').join('')}</select></label></div><div id="sharedBox" class="hidden"><label>طريقة توزيع التكلفة<select id="basis"><option value="area">حسب المساحة (فدان)</option><option value="equal">بالتساوي</option><option value="manual">مبالغ يدوية لكل حواشة</option></select></label><div id="sharedFields">${targets.map(f=>'<label class="check"><input type="checkbox" name="sharedField" value="'+f.id+'"> '+escapeHtml(f.code+' — '+f.farmer+' ('+f.area+' فدان)')+'</label>').join('')}</div><div id="manualBox" class="hidden">${targets.map(f=>'<label>'+escapeHtml(f.code)+' — '+escapeHtml(f.farmer)+'<input type="number" step="0.01" min="0" data-manual="'+f.id+'" placeholder="المبلغ المخصص"></label>').join('')}</div></div><label>ملاحظات / رقم الإيصال<textarea id="enote"></textarea></label><button style="width:100%" onclick="saveExpense()">حفظ المصروف وتوزيعه</button>`);$('#basis').onchange=()=>$('#manualBox').classList.toggle('hidden',$('#basis').value!=='manual');$('#eamount').oninput=()=>{if($('#eqty').value&&$('#eprice').value)$('#eamount').dataset.auto='';};$('#eqty').oninput=calcAmount;$('#eprice').oninput=calcAmount}
function calcAmount(){const q=Number($('#eqty').value),p=Number($('#eprice').value);if(q&&p)$('#eamount').value=(q*p).toFixed(2)}
function toggleAlloc(){const shared=document.querySelector('input[name="emode"]:checked').value==='shared';$('#individualBox').classList.toggle('hidden',shared);$('#sharedBox').classList.toggle('hidden',!shared)}
function saveExpense(){const amount=Number($('#eamount').value),mode=document.querySelector('input[name="emode"]:checked').value;if(!(amount>0))return alert('أدخل مبلغاً صحيحاً.');let allocations=[],allocationBasis='individual';if(mode==='individual'){allocations=[{fieldId:$('#efield').value,amount,basis:'individual'}]}else{const chosen=[...document.querySelectorAll('input[name="sharedField"]:checked')].map(x=>x.value);if(!chosen.length)return alert('اختر الحواشات التي تستفيد من المصروف.');const basis=$('#basis').value;allocationBasis=basis;const fs=chosen.map(fid=>data.fields.find(f=>f.id===fid));if(basis==='manual'){allocations=fs.map(f=>({fieldId:f.id,amount:Number(document.querySelector('[data-manual="'+f.id+'"]').value)||0,basis:'manual'})).filter(a=>a.amount>0);const sum=allocations.reduce((s,a)=>s+a.amount,0);if(Math.abs(sum-amount)>0.01)return alert('مجموع المبالغ اليدوية يجب أن يساوي إجمالي المصروف.');}else{const totalWeight=fs.reduce((s,f)=>s+(basis==='area'?Number(f.area):1),0);allocations=fs.map(f=>({fieldId:f.id,amount:amount*(basis==='area'?Number(f.area):1)/totalWeight,basis}));const diff=amount-allocations.reduce((s,a)=>s+a.amount,0);allocations[0].amount+=diff;}}
const rec={id:id(),seasonId:activeSeason().id,allocationBasis,date:$('#edate').value,category:$('#ecat').value.trim()||'غير مصنف',description:$('#edesc').value.trim(),amount,quantity:Number($('#eqty').value)||null,unitPrice:Number($('#eprice').value)||null,vendor:$('#evendor').value.trim(),mode,allocations,note:$('#enote').value.trim(),createdAt:new Date().toISOString()};data.expenses.push(rec);closeModal();save();alert('تم حفظ المصروف بنجاح.')}
function fieldReport(fid){const f=data.fields.find(x=>x.id===fid);const es=data.expenses.filter(e=>(e.allocations||[]).some(a=>a.fieldId===fid));const rows=es.map(e=>{const a=e.allocations.find(x=>x.fieldId===fid);return '<tr><td>'+escapeHtml(e.date)+'</td><td>'+escapeHtml(e.category)+'</td><td>'+escapeHtml(e.description)+'</td><td>'+money(a.amount)+'</td></tr>'}).join('');const w=window.open('','_blank');if(!w)return alert('اسمح بفتح نافذة التقرير.');w.document.write('<html dir="rtl"><meta charset="utf-8"><title>تقرير الحواشة</title><style>body{font-family:Tahoma;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px;text-align:right}h1{color:#24583b}</style><h1>WAS – تقرير تكاليف الحواشة</h1><h3>'+escapeHtml(f.code)+' — '+escapeHtml(f.farmer)+'</h3><p>'+escapeHtml(f.crop)+' | '+money(f.area)+' فدان</p><h2>الإجمالي: '+money(fieldTotal(fid))+' '+escapeHtml(data.currency)+'</h2><p>تكلفة الفدان: '+money(f.area?fieldTotal(fid)/f.area:0)+'</p><table><tr><th>التاريخ</th><th>التصنيف</th><th>البيان</th><th>نصيب الحواشة</th></tr>'+rows+'</table><script>window.print()<\/script></html>');w.document.close()}
function activateSeason(sid){data.seasons.forEach(s=>s.active=s.id===sid);save()}
function newSeason(){const name=prompt('اسم الموسم الجديد:');if(!name)return;data.seasons.forEach(s=>s.active=false);data.seasons.push({id:id(),name,active:true});save()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='WAS-costs-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.fields)||!Array.isArray(d.expenses))throw 0;if(!confirm('سيتم استبدال البيانات الحالية. هل تريد المتابعة؟'))return;data={...defaults,...d};save();alert('تمت استعادة النسخة.')}catch{alert('ملف النسخة غير صالح.')}};r.readAsText(file)}
function exportCSV(){const rows=[['رقم الحواشة','اسم المزارع','المحصول','المساحة','إجمالي التكلفة','تكلفة الفدان']];seasonFields().forEach(f=>rows.push([f.code,f.farmer,f.crop,f.area,fieldTotal(f.id),f.area?fieldTotal(f.id)/f.area:0]));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='WAS-costs-'+activeSeason().name+'.csv';a.click()}

async function cloudContext(c){const {data:{user},error}=await c.auth.getUser();if(error)throw error;if(!user)throw new Error('سجّل الدخول أولاً من تطبيق WAS الرئيسي بنفس البريد وكلمة المرور.');let org=localStorage.getItem('was_cloud_org_id');if(!org){const {data:members,error:me}=await c.from('organization_members').select('organization_id').eq('user_id',user.id).limit(1);if(me)throw me;if(members?.length)org=members[0].organization_id;else{const {data:o,error:oe}=await c.from('organizations').insert({name:data.company||'WAS – إدارة تكاليف التقاوي',created_by:user.id}).select('id').single();if(oe)throw oe;org=o.id}localStorage.setItem('was_cloud_org_id',org)}return{user,org}}
function ensureCloudIds(){for(const s of data.seasons){if(!s.cloudId)s.cloudId=crypto.randomUUID()}for(const f of data.fields){if(!f.cloudId)f.cloudId=crypto.randomUUID()}for(const e of data.expenses){if(!e.cloudId)e.cloudId=crypto.randomUUID();if(!e.seasonId)e.seasonId=activeSeason().id}}
async function cloudPush(){const status=document.getElementById('cloudStatus');try{if(!navigator.onLine)throw new Error('لا يوجد اتصال بالإنترنت. البيانات محفوظة محلياً.');status.textContent='جارٍ رفع المواسم والحواشات والمصروفات…';const c=cloudClient(),{user,org}=await cloudContext(c);ensureCloudIds();localStorage.setItem(KEY,JSON.stringify(data));
const seasons=data.seasons.map(s=>({id:s.cloudId,organization_id:org,name:s.name,is_active:!!s.active,created_by:user.id}));
if(seasons.length){const r=await c.from('cost_seasons').upsert(seasons,{onConflict:'id'});if(r.error)throw r.error}
const fields=data.fields.map(f=>({id:f.cloudId,organization_id:org,season_id:(data.seasons.find(s=>s.id===f.seasonId)||activeSeason()).cloudId,field_code:f.code,farmer_name:f.farmer,crop_name:f.crop,area_feddan:f.area,village:f.village||null,contract_no:f.contractNo||null,notes:f.notes||null,created_by:user.id}));
if(fields.length){const r=await c.from('cost_fields').upsert(fields,{onConflict:'id'});if(r.error)throw r.error}
const entries=data.expenses.map(e=>({id:e.cloudId,organization_id:org,season_id:(data.seasons.find(s=>s.id===e.seasonId)||activeSeason()).cloudId,entry_date:e.date,category:e.category,description:e.description||null,entry_mode:e.mode,total_amount:e.amount,quantity:e.quantity,unit:e.unit||null,unit_price:e.unitPrice,vendor:e.vendor||null,receipt_ref:e.receiptRef||null,notes:e.note||null,allocation_basis:e.allocationBasis||(e.mode==='shared'?'area':'individual'),created_by:user.id}));
if(entries.length){const r=await c.from('cost_entries').upsert(entries,{onConflict:'id'});if(r.error)throw r.error}
const fieldMap=new Map(data.fields.map(f=>[f.id,f.cloudId]));const allocations=[];for(const e of data.expenses){for(const a of (e.allocations||[])){const fieldId=fieldMap.get(a.fieldId);if(fieldId)allocations.push({organization_id:org,cost_entry_id:e.cloudId,field_id:fieldId,allocated_amount:Number(a.amount)||0,allocation_weight:null,allocation_basis:a.basis||e.allocationBasis||'individual'})}}
if(allocations.length){const r=await c.from('cost_allocations').upsert(allocations,{onConflict:'cost_entry_id,field_id'});if(r.error)throw r.error}
status.textContent='اكتملت المزامنة: '+seasons.length+' موسم، '+fields.length+' حواشة، '+entries.length+' مصروف.';alert(status.textContent);render();
}catch(e){status.textContent='تعذر الرفع: '+(e.message||e);alert(status.textContent)}}
async function cloudPull(){const status=document.getElementById('cloudStatus');if(!confirm('سيتم استبدال البيانات المحلية ببيانات قاعدة WAS السحابية. صدّر نسخة احتياطية أولاً. هل تريد المتابعة؟'))return;try{if(!navigator.onLine)throw new Error('لا يوجد اتصال بالإنترنت.');status.textContent='جارٍ تحميل بيانات المؤسسة…';const c=cloudClient(),{org}=await cloudContext(c);
const [sr,fr,er,ar]=await Promise.all([c.from('cost_seasons').select('*').eq('organization_id',org),c.from('cost_fields').select('*').eq('organization_id',org),c.from('cost_entries').select('*').eq('organization_id',org),c.from('cost_allocations').select('*').eq('organization_id',org)]);
for(const x of [sr,fr,er,ar])if(x.error)throw x.error;
const seasons=(sr.data||[]).map(s=>({id:s.id,cloudId:s.id,name:s.name,active:s.is_active}));
const fields=(fr.data||[]).map(f=>({id:f.id,cloudId:f.id,seasonId:f.season_id,seasonName:seasons.find(s=>s.id===f.season_id)?.name||'',code:f.field_code,farmer:f.farmer_name,crop:f.crop_name,area:Number(f.area_feddan),village:f.village||'',contractNo:f.contract_no||'',notes:f.notes||''}));
const fieldLocal=new Map(fields.map(f=>[f.cloudId,f.id]));
const expenses=(er.data||[]).map(e=>({id:e.id,cloudId:e.id,seasonId:e.season_id,date:e.entry_date,category:e.category,description:e.description||'',amount:Number(e.total_amount),quantity:e.quantity==null?null:Number(e.quantity),unit:e.unit||'',unitPrice:e.unit_price==null?null:Number(e.unit_price),vendor:e.vendor||'',receiptRef:e.receipt_ref||'',mode:e.entry_mode,allocationBasis:e.allocation_basis||'individual',note:e.notes||'',createdAt:e.created_at,allocations:(ar.data||[]).filter(a=>a.cost_entry_id===e.id).map(a=>({fieldId:fieldLocal.get(a.field_id),amount:Number(a.allocated_amount),basis:a.allocation_basis})).filter(a=>a.fieldId)}));
if(!seasons.length&&!fields.length&&!expenses.length)throw new Error('لا توجد بيانات تكاليف سحابية لهذه المؤسسة بعد.');
data={...defaults,...data,seasons,fields,expenses};localStorage.setItem(KEY,JSON.stringify(data));status.textContent='تمت الاستعادة: '+seasons.length+' موسم، '+fields.length+' حواشة، '+expenses.length+' مصروف.';render();alert(status.textContent);
}catch(e){status.textContent='تعذرت الاستعادة: '+(e.message||e);alert(status.textContent)}}
